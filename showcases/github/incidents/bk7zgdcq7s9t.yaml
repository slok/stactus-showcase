name: Disruption with some GitHub services
impact: minor
systems: []
timeline:
    - ts: "2026-09-15 19:11:31"
      description: We are investigating reports of impacted performance for some GitHub services.
      investigating: true
    - ts: "2026-09-15 19:48:02"
      description: The degradation has been mitigated. We are monitoring to ensure stability.
    - ts: "2026-09-15 20:00:50"
      description: On September 15, 2026 between 15:30 and 20:00 UTC, some Copilot code reviews on pull requests failed to complete. The cause was increased latency in an internal caching service that GitHub Copilot Code Review relies on to coordinate its review jobs. This caused a timeout in lock acquisition, which interrupted the job. We reverted the change to the internal caching service and restored normal operation by 20:00 UTC.<br /><br />We sincerely apologize for the disruption.
      resolved: true
