    - ts: "2026-08-01 11:20:02"
      description: We are experiencing degraded availability for the GPT-5.6 Luna model in Copilot products and IDE surfaces. This is due to an issue with an upstream model provider. While we work with them to resolve the issue, we recommend choosing another model or selecting 'Auto' to continue using Copilot
      investigating: true
    - ts: "2026-08-01 12:13:24"
      description: We keep working with our upstream model provider, and are observing recovery. We continue monitoring to ensure stability.
