name: Disruption with GitHub Billing
impact: minor
systems: []
timeline:
    - ts: "2026-08-26 23:37:20"
      description: We are investigating reports of impacted performance for some GitHub services.
      investigating: true
    - ts: "2026-08-26 23:42:06"
      description: We are currently investigating increased errors with billing services. Customers may observe failed billing budget page loads, and users of the Copilot CLI may observe failures starting or continuing sessions.
      investigating: true
    - ts: "2026-08-27 00:31:22"
      description: We've applied a mitigation to unblock Copilot usage and have observed recovery for this particular impact. We're continuing to investigate and apply mitigations for the billing page disruption while monitoring to ensure Copilot remains recovered.
      investigating: true
    - ts: "2026-08-27 01:35:35"
      description: We are continuing to monitor the mitigation that we have applied for the billing page disruption.
      investigating: true
    - ts: "2026-08-27 14:49:36"
      description: Our mitigation is still holding as we continue to investigate to find the root cause.
      investigating: true
    - ts: "2026-08-27 16:20:23"
      description: Our mitigation continues to hold, and service conditions remain stable. We are continuing to investigate the concentrated workload responsible for the issue and are preparing additional preventative improvements. We have not identified a material change in customer impact since the previous update. We will provide another update as the investigation progresses.
      investigating: true
    - ts: "2026-08-27 17:58:39"
      description: No material change since the previous update. Service conditions remain stable following the mitigation, and we have not observed any further customer impact. We are actively monitoring the service while implementing targeted fixes to address the underlying root cause.
      investigating: true
    - ts: "2026-08-27 19:44:08"
      description: On August 26, 2026, between 20:40 UTC and 00:51 UTC on August 27, GitHub Billing experienced degraded performance affecting billing budget pages and GitHub Copilot CLI sessions. Affected customers encountered failed budget page loads or failures when starting or continuing CLI sessions. We confirmed this impact for a small number of customers (<1%). <br /><br />This was caused by a concentrated workload that created processing delays in our data storage layer. Automated retries increased the load and prolonged the degradation. We mitigated the incident by rebalancing traffic within our infrastructure. <br /><br />We are improving workload isolation, retry behavior, and detection of concentrated load to reduce the likelihood of recurrence and shorten our time to detect and mitigate similar incidents.
      resolved: true
