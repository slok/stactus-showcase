name: Incident with Pull Requests
impact: minor
systems:
    - hhtssxt0f5v2
timeline:
    - ts: "2026-09-20 22:13:37"
      description: We are investigating reports of degraded performance for Pull Requests
      investigating: true
    - ts: "2026-09-20 22:27:28"
      description: The degradation affecting Pull Requests has been mitigated. We are monitoring to ensure stability.
    - ts: "2026-09-20 22:32:02"
      description: A git fileserver issue caused a brief delay in creating some merge commits - we've isolated the underlying server and already observed recovery.
    - ts: "2026-09-20 23:22:16"
      description: On September 20, 2026, between 21:46 and 22:24 UTC the Pull Requests service was degraded and pull request merge and test-merge commits were created late, with delays reaching approximately four minutes at peak. Merge commits were delayed rather than lost. Because some Actions workflow runs start only after a pull request's merge commit is created, a subset of workflow runs for pull request events were also delayed. <br /><br />This was due to a routine repository maintenance job for an unusually large repository consuming nearly all of the memory on a single Git storage server, which left that server unable to serve the Git operations used to create merge commits. <br /><br />We mitigated the incident by removing the affected server from service at 22:18 UTC, after which the queued merge commits were created within six minutes. <br /><br />We have capped the memory a single repository maintenance job may consume so that one repository cannot exhaust a server, and we have improved monitoring and alerting on storage server health to reduce our time to detection and mitigation of issues like this one in the future.
      resolved: true
