version: incident/v1
id: g40zcbvchny4
name: Some SSH connections using deploy keys are failing
impact: critical
systems: []
timeline:
    - ts: "2026-07-21 10:31:44"
      description: We are investigating reports of impacted performance for some GitHub services.
      investigating: true
    - ts: "2026-07-21 11:04:43"
      description: We are investigating reports of intermittent SSH authentication failures affecting connections that use deploy keys. Customers may experience failed SSH connections when interacting with repositories via deploy keys. Our engineering team is actively investigating the root cause and working toward resolution.
      investigating: true
    - ts: "2026-07-21 11:46:47"
      description: We have identified a recent code change as a potential cause of the SSH authentication failures affecting deploy key connections. Our engineering team is rolling back this change. Customers using deploy keys for SSH access to repositories may continue to experience intermittent connection failures until the fix is deployed.
      investigating: true
    - ts: "2026-07-21 11:57:01"
      description: On July 21, 2026, between 07:41 UTC and 11:57 UTC, the SSH Authentication service was degraded and some SSH connections failed to authenticate. On average, 12.2% of SSH authentication requests failed, peaking at 15.7%. Both user RSA keys and deploy keys were impacted. This was due to a change in how our SSH service handled one public-key authentication method that caused the affected authentication attempts to be rejected as invalid. <br /><br />We mitigated the incident by reverting the change, after which SSH authentication returned to normal. <br /><br />We are working to expand our automated test coverage for our SSH public-key authentication flows to catch more edge cases and to improve observability and alerting on SSH authentication failures, to reduce our time to detection and mitigation of issues like this one in the future.
      resolved: true
