timeline:
    - ts: "2026-08-26 15:11:58"
      description: We are investigating reports of degraded availability for Actions
      investigating: true
    - ts: "2026-08-26 15:12:21"
      description: Pages is experiencing degraded performance. We are continuing to investigate.
      investigating: true
    - ts: "2026-08-26 15:23:10"
