version: incident/v1
id: bmpybhnrky3x
name: Intermittent failures in runner group and runner-related permissions pages
impact: minor
systems: []
timeline:
    - ts: "2026-08-18 07:40:35"
      description: We are investigating reports of impacted performance for some GitHub services.
      investigating: true
    - ts: "2026-08-18 07:40:42"
      description: We are investigating reports of failure to load runner groups and runner-related permissions for customers using larger runners.
    - ts: "2026-08-18 10:41:40"
      description: We have identified the source of a communication issue between Actions services and are working toward mitigation. Customers may experience failure to load runner groups and runner-related permissions issues when using Larger Runners.
    - ts: "2026-08-18 11:24:06"
      description: We have applied a mitigation and are seeing recovery signals. We will continue monitoring recovery and providing updates.
    - ts: "2026-08-18 11:42:59"
      description: On August 18, 2026, between 05:02 UTC and 11:30 UTC, customers were unable to view or manage Actions Runners and Runner Groups through the GitHub UI and API. <br /><br />The issue was caused by failures in backend requests reading runner and runner group data. The failures were caused by an expired authentication certificate unique to this service. The certificate had been rotated in KeyVault, but a step to enable use at runtime had been paused to prevent recurrence of previous incidents triggered by this operation. <br /><br />The impact was mitigated by completing the enablement of the new certificate in the backend system. We have added additional monitoring to this and other certificates. This service is also in the process of being replaced as part of our availability and scale work, bringing this authentication path and secret management in line with patterns across all GitHub services.
      resolved: true
