timeline:
    - ts: "2026-07-25 09:42:28"
      description: We are investigating reports of degraded availability for Copilot AI Model Providers
      investigating: true
    - ts: "2026-07-25 09:48:30"
      description: We are experiencing degraded availability for the GPT-5.2, GPT-5.3-Codex, GPT-5.4, GPT-5.4 Mini, GPT-5.6 Sol, GPT-5.6 Terra, and GPT-5.6 Luna models in Copilot products and IDE surfaces. This is due to an issue with an upstream model provider. While we work with them to resolve the issue, we recommend choosing another model or selecting 'Auto' to continue using Copilot.
      investigating: true
    - ts: "2026-07-25 10:04:39"
      description: The degradation affecting Copilot AI Model Providers has been mitigated. We are monitoring to ensure stability.
    - ts: "2026-07-25 10:11:16"
      description: On July 25, 2026, between 09:07 and 10:04 UTC, the GPT-5.2, GPT-5.3-Codex, GPT-5.4, GPT-5.4 Mini, GPT-5.6 Sol, GPT-5.6 Terra and GPT-5.6 Luna models experienced degraded availability in GitHub Copilot products and IDE surfaces. Requests to these models had an average failure rate of 5.6%. Other Copilot models remained available as alternatives.<br /><br />The degradation was caused by an issue with an upstream model provider. Success rates returned to normal after the upstream issue was mitigated, and we continued monitoring before resolving the incident. We are working on improving the automated failover for the affected models to prevent similar incidents in the future.
      resolved: true
