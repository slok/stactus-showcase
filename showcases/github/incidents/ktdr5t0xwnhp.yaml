    - ts: "2026-09-03 14:20:35"
      description: We are experiencing degraded availability for the Grok 4.6 model in Copilot Chat, VS Code and other Copilot products. This is due to an issue with an upstream model provider. We are working with them to resolve the issue.<br />
      investigating: true
    - ts: "2026-09-03 14:22:44"
      description: The Grok 4.5 model has degraded availability as well. We are working with the upstream provider to resolve the issue.
      investigating: true
    - ts: "2026-09-03 17:11:39"
      description: The issues with our upstream model provider have been resolved, and Grok models are once again available in Copilot products and IDE surfaces.<br />We will continue monitoring to ensure stability, but mitigation is complete.
      investigating: true
    - ts: "2026-09-03 17:11:47"
      description: Between 13:22 and 17:11 UTC on September 03, 2026, GitHub Copilot experienced degradation affecting several Grok models, including Grok 4.5 and Grok 4.6. Users encountered elevated error rates, but other models were not affected. The degradation was caused by an issue with an upstream model provider. GitHub engineers detected the issue through automated monitoring, displayed in-product warnings for the affected models, and coordinated with the provider. Service returned to normal after the provider implemented a mitigation.
      resolved: true
