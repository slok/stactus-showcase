name: Disruption with Copilot Code Review
impact: major
systems: []
timeline:
    - ts: "2026-09-04 20:39:03"
      description: We are investigating reports of impacted performance for some GitHub services.
      investigating: true
    - ts: "2026-09-04 20:57:53"
      description: Some users may be experiencing failures when using Copilot code review. We have identified the root cause and are working on a mitigation.
      investigating: true
    - ts: "2026-09-04 21:54:22"
      description: We are applying the mitigation and expect recovery within approximately 30 minutes.
      investigating: true
    - ts: "2026-09-04 22:25:44"
      description: The degradation has been mitigated. We are monitoring to ensure stability.
    - ts: "2026-09-04 22:26:46"
      description: On September 4, 2026, between 20:04 and 22:26 UTC, GitHub Copilot code review experienced an increased failure rate. Affected pull request reviews failed to complete or post review comments.<br /><br />The incident was caused by a change to the service’s authentication permissions that prevented it from submitting affected reviews to the GitHub API. We reverted the change and restored normal operation by 22:26 UTC.<br /><br />We apologize for the disruption.
      resolved: true
