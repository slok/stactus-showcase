version: incident/v1
id: kzh5j0mt7qwc
name: Actions Larger Runner Jobs for some customers may be slow to start
impact: minor
systems: []
timeline:
    - ts: "2026-09-14 18:40:25"
      description: We are investigating reports of impacted performance for some GitHub services.
      investigating: true
    - ts: "2026-09-14 19:01:52"
      description: The degradation has been mitigated. We are monitoring to ensure stability.
    - ts: "2026-09-14 19:35:48"
      description: On September 14, 2026, between 16:10 and 19:01 UTC, some customers using GitHub Actions larger runners experienced longer-than-normal wait times for jobs to start. During this period, <b>5.7%</b> of larger-runner jobs were affected. <br /><br />A routine expansion of our compute capacity exposed a bug in how our provisioning system handled capacity records when selecting where to create runner virtual machines. This slowed the creation of new runners, leaving insufficient runner capacity to start affected jobs promptly. <br /><br />We restored normal provisioning by correcting the affected capacity records. We have fixed the underlying capacity-selection bug to prevent this failure from recurring. We have also added alerts for VM-record creation failures associated with this capacity issue.
      resolved: true
