name: Disruption with GPT 5.3 Codex
impact: minor
systems:
    - cnnb39dkkk82
timeline:
    - ts: "2026-07-20 16:03:51"
      description: We are investigating reports of degraded performance for Copilot AI Model Providers
      investigating: true
    - ts: "2026-07-20 16:04:26"
      description: We are investigating GPT Codex 5.3 performance.
      investigating: true
    - ts: "2026-07-20 16:39:46"
      description: We identified that an upstream provider is returning errors for GPT 5.3 Codex requests, causing some users to experience failed or interrupted responses. Traffic is being automatically rerouted to mitigate impact. We are working with the upstream provider to resolve the underlying issue. We recommend using a different model at this time while we resolve the problem.
      investigating: true
    - ts: "2026-07-20 17:21:18"
      description: The upstream provider continues to return intermittent errors for GPT 5.3 Codex requests. Some users may experience failed or interrupted responses when using this model. Traffic continues to be automatically rerouted to reduce impact, and we are actively working with the upstream provider on a resolution. In the meantime, selecting an alternative model will avoid disruption.
      investigating: true
    - ts: "2026-07-20 18:25:51"
      description: We are seeing signs of sustained recovery from the upstream provider for GPT 5.3 Codex requests. Requests  are succeeding as expected. We are awaiting confirmation from the provider that the issue is fully mitigated before resolving this incident.
      investigating: true
    - ts: "2026-07-20 18:37:08"
      description: Between 06:39 and 18:11 UTC on July 20, 2026, the Copilot service experienced a degradation of the GPT 5.3 model due to an issue with our upstream provider. The upstream model provider returned intermittent errors for GPT 5.3 Codex requests, which caused some responses to fail. Auto mode requests that had selected GPT 5.3 Codex were also impacted. On average about 2% of GPT 5.3 Codex requests failed during this window. Copilot automatically routed eligible traffic away from the impacted provider to reduce customer impact. No other models were impacted.<br /><br />We worked with the upstream provider throughout the incident and confirmed sustained recovery before resolving.
      resolved: true
