name: 400 Error on Plan Downgrades and Cancellations for Accounts with Dedicated IPs
impact: minor
systems: []
timeline:
    - ts: "2026-08-10 16:21:12"
      description: Our engineers have identified the issue (identified at 9:58 AM PDT) and are working toward a fix. Customers attempting to cancel or downgrade a SendGrid plan that has a dedicated IP are currently receiving a 400 error. If you need to downgrade or cancel, the current workaround is to reach out to Support to request an IP removal. We will provide another update in 1 hour or as soon as more information becomes available. Mail sending is not impacted, and any downgrades or cancellations currently in progress remain unaffected.
