timeline:
    - ts: "2026-09-01 11:23:36"
      description: |-
        We are currently experiencing an active Firebase outage that is impacting notification delivery for some Twilio customers. Customers using Twilio products that rely on Firebase Cloud Messaging may experience disrupted or delayed notification delivery. Affected products may include:

        Twilio Voice
        Twilio Conversations
        Twilio Notify
        Authy

        This issue is related to an upstream Firebase service disruption and may affect push notification delivery to end users. Our teams are actively monitoring the situation and we will provide an update in 1 hour or as more information becomes available.
      investigating: true
