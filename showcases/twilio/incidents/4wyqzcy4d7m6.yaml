    - ts: "2026-09-18 20:01:44"
      description: We are investigating an issue affecting phone number registration to A2P 10DLC campaigns. At this time customers may experience delays in adding, deleting, or updating number registration to A2P 10DLC campaigns. We recommend customers to not move North American phone numbers between Messaging Services. A remove or an add of a phone number would distrust the traffic on that number. This does not impact North American Toll Free numbers. We will provide another update in 1 hour or as soon as more information becomes available.
      investigating: true
    - ts: "2026-09-18 21:01:40"
      description: Our engineers have identified the issue impacting phone number registration to A2P 10DLC campaigns, and are working with our carrier partners to deploy a fix. At this time customers may experience delays in adding, deleting, or updating number registration to A2P 10DLC campaigns. We recommend customers to not move North American phone numbers between Messaging Services. A remove or an add of a phone number would distrust the traffic on that number. This does not impact North American Toll Free numbers. We will provide another update in 1 hour or as soon as more information becomes available.
    - ts: "2026-09-18 22:02:10"
      description: Our engineers have identified the issue impacting phone number registration to A2P 10DLC campaigns, and we have deployed a fix. At this time we are seeing recovery, but customers may still experience delays in adding, deleting, or updating number registration to A2P 10DLC campaigns. We recommend customers to not move North American phone numbers between Messaging Services. A remove or an add of a phone number would distrust the traffic on that number. This does not impact North American Toll Free numbers. We will provide another update in 2 hours or as soon as more information becomes available.
    - ts: "2026-09-18 23:00:49"
