      description: We are aware of an issue affecting phone number registration to A2P 10DLC campaigns. At this time customers may experience delays in adding, deleting, or updating number registration to A2P 10DLC campaigns. Our team is actively investigating and we will provide another update in 1 hour or as soon as more information becomes available.
