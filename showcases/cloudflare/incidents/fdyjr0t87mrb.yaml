name: Email Security delivery impacted by Spamhaus listing
impact: major
systems:
    - h9z388jfrjsm
    - 8jjy5n5bfl9v
timeline:
    - ts: "2026-08-12 15:04:14"
      description: We are currently investigating an issue where customers that use Spamhaus for additional filtering of email downstream from the Cloudflare Email Security service are rejecting emails from IPs in the 134.195.26.0/23 block. This IP block should be allowed for all customer downstream systems to avoid treating the Email Security service as an originator of mail. We recommend all Cloudflare Email Security customers disable Spamhaus filtering in downstream systems.
      investigating: true
    - ts: "2026-08-12 15:07:00"
      description: We are continuing to investigate this issue.
      investigating: true
    - ts: "2026-08-12 16:30:55"
      description: |-
        We are continuing to investigate this issue.

        Customers using O365 will be impacted only if they have not completed the required setup. Please check your setup and ensure the connector includes all egress IPs:

        https://developers.cloudflare.com/cloudflare-one/email-security/setup/pre-delivery-deployment/prerequisites/m365-email-security-mx/#2-configure-enhanced-filtering
      investigating: true
    - ts: "2026-08-12 16:48:03"
      description: All IPs previously listed by Spamhaus are now clean. Monitoring the propagation of that change to downstream systems.
    - ts: "2026-08-12 17:23:45"
      description: This incident is now resolved.
      resolved: true
