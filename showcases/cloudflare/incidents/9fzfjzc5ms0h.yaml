timeline:
    - ts: "2026-08-07 18:42:26"
      description: Cloudflare is aware, and investigating an issue affecting availability in ENAM for a small number of R2 buckets.
      investigating: true
    - ts: "2026-08-07 22:54:11"
      description: We have identified the cause and mitigated further impact. Writes to a small set of buckets in ENAM were impacted between 14:52-17:02 UTC. We are continuing to work to restore normal availability for these buckets.
    - ts: "2026-08-07 23:05:19"
      description: We are continuing to work on a fix for this issue.
    - ts: "2026-08-08 10:52:56"
      description: We are continuing to restore availability for impacted R2 buckets in ENAM. Recovery is progressing well, and we will provide status updates as they becomes available
    - ts: "2026-08-08 23:28:09"
      description: Availability has been restored for nearly all impacted R2 buckets. A small number of objects uploaded through multipart uploads in ENAM between 14:52 and 17:02 UTC on August 7 remain unavailable. We are continuing to restore access and expect to be able to provide another update soon.
